services:
  # ── Laravel backend ──────────────────────────────────────────
  # No own MySQL service — database consolidation: this app shares ONE physical
  # MySQL database (company_system_db) with the Main system and DTS. The shared
  # `db` service is owned by exam-history-management's own docker-compose.yml
  # (container name "company-mysql") and reached here over the external
  # `company-db-net` network. No native cross-compose-file `depends_on` health-gate
  # exists, so this relies on `restart: unless-stopped` to recover from a first-boot
  # race if company-mysql isn't up yet — see CLAUDE.md "Database Consolidation".
  # `company-db-net` must be created once (`docker network create company-db-net`)
  # and company-mysql must be started before this service, for the same reason.
  #
  # CACHE_STORE/SESSION_DRIVER/QUEUE_CONNECTION stay `database` — this app's
  # `cache`/`jobs`/`failed_jobs`/etc. tables are unprefixed in the shared database;
  # no collision exists today (Main uses file-based cache/session, DTS uses none of
  # these), but this is a known, documented follow-up risk if that ever changes —
  # see CLAUDE.md "Database Consolidation" risk notes.
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mock-exam-backend
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: company-mysql
      DB_PORT: 3306
      DB_DATABASE: company_system_db
      DB_USERNAME: root
      DB_PASSWORD: secret
      JWT_SECRET: ${JWT_SECRET}
      JWT_TTL: ${JWT_TTL:-60}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-20160}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
    volumes:
      - ./backend:/var/www/html
      - /var/www/html/vendor
    expose:
      - "8000"
    networks:
      - default
      - proxy-net
      - company-db-net

  # ── React frontend (production build) ────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      args:
        VITE_API_BASE_URL: /miyazaki-shiken-lab/api/v1
    container_name: mock-exam-frontend
    restart: unless-stopped
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - default
      - proxy-net

networks:
  default:
    name: mock-exam-system-net
  proxy-net:
    external: true
  # Owned by exam-history-management's own docker-compose.yml — see the `backend`
  # service comment above.
  company-db-net:
    external: true
