server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — all unknown paths return index.html for React Router.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Static assets — long-lived cache, return 404 if missing (never fallback to HTML).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|ttf|eot|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
